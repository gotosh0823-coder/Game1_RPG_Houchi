<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<title>放置RPG（仮）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- 進捗 -->
  <header id="hud-top">
    <!-- デバッグ用：確認のたびに実時間を待たなくて済むようにする -->
    <button id="speed-toggle" title="デバッグ用の倍速">×1</button>
    <button id="alex-add" title="デバッグ用：アレキサンドライトを200個追加">💎<span id="alex-count">0</span></button>
    <span id="stage-label">ステージ 1</span>
    <span id="battle-label">戦闘 1/10</span>
  </header>

  <!-- 戦闘画面：左に敵（最大5体）、右に味方4人 -->
  <main id="screen-battle" class="screen is-active">
    <div id="field">
      <div id="enemies" class="column"></div>
      <div id="allies" class="column"></div>
    </div>
  </main>

  <!-- 編成：4枠にジョブを割り当てる。限界突破もここから -->
  <main id="screen-party" class="screen">
    <h2 class="screen-title">編成</h2>
    <div id="party-slots" class="slot-row"></div>
    <h3 class="sub-title">ジョブ<span class="hint">タップで選択中の枠に入れる（重複可）</span></h3>
    <div id="party-jobs" class="card-list"></div>
    <div id="party-detail"></div>
  </main>

  <!-- 装備：ジョブごとに4部位。強化・合成・売却もここ -->
  <main id="screen-equip" class="screen">
    <h2 class="screen-title">装備</h2>
    <div id="equip-tabs" class="tabs"></div>
    <div id="equip-slots" class="card-list"></div>
    <h3 class="sub-title">所持品<span class="hint" id="equip-count"></span></h3>
    <div id="equip-bag" class="card-list"></div>
  </main>

  <!-- 店：モグボナンザ（ガチャ限定枠） -->
  <main id="screen-shop" class="screen">
    <h2 class="screen-title">モグボナンザ</h2>
    <p class="lead">アレキサンドライトを使って、ガチャ限定の装備を引く。<br>
      排出はすべて限定枠。同じ名称を重ねて N → R → SR → SSR → UR に育てる。</p>
    <div id="shop-actions" class="shop-actions"></div>
    <div id="shop-result" class="gacha-result"></div>
    <h3 class="sub-title">排出率</h3>
    <div id="shop-rates" class="rate-table"></div>
  </main>

  <main id="screen-achievements" class="screen">
    <h2 class="screen-title">実績・遺物</h2>
    <div id="record-tabs" class="tabs">
      <button class="tab is-active" data-tab="ach">実績</button>
      <button class="tab" data-tab="relic">遺物<span id="relic-count"></span></button>
    </div>
    <div id="ach-list"></div>
    <div id="relic-list" class="hidden"></div>
  </main>

  <main id="screen-settings" class="screen">
    <h2 class="screen-title">設定</h2>
    <div class="setting-row">
      <label for="autosell">自動売却</label>
      <select id="autosell"></select>
      <p class="hint">選んだレア度以下の装備は、拾った瞬間にギルへ変わる（所持枠を空けるため）</p>
    </div>
    <div class="setting-row">
      <button id="btn-reset" class="danger">セーブデータを消して最初から</button>
    </div>
  </main>

  <!-- 唯一の操作：固有アビリティ4ボタン -->
  <div id="ability-bar"></div>

  <!-- 下部HUD -->
  <footer id="hud-bottom">
    <div id="gold">💰 0</div>
    <nav id="nav">
      <button data-screen="battle" class="is-active">戦闘</button>
      <button data-screen="party">編成</button>
      <button data-screen="equip">装備</button>
      <button data-screen="shop">店</button>
      <button data-screen="achievements">実績</button>
      <button data-screen="settings">設定</button>
    </nav>
  </footer>

</div>

<!-- 留守中の成果 -->
<div id="offline-modal" class="modal hidden">
  <div class="modal-box">
    <h2>留守中の成果</h2>
    <p id="offline-text"></p>
    <button id="offline-close">受け取る</button>
  </div>
</div>

<!-- 全滅時の遺物選択。開いているあいだは戦闘を止める -->
<div id="relic-modal" class="modal hidden">
  <div class="modal-box relic-box">
    <h2>全滅　―　遺物をひとつ持ち帰る</h2>
    <p id="relic-lead"></p>
    <div id="relic-choices"></div>
  </div>
</div>

<!-- 下から出る共通シート（装備の付け替え・ジョブ選択など） -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-box">
    <div class="sheet-head">
      <span id="sheet-title"></span>
      <button id="sheet-close" aria-label="閉じる">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
